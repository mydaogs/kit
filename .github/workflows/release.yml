name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The tag only triggers the release; package.json is the version of
      # record. Without this gate a v0.2.0 tag over 0.1.0 manifests publishes
      # 0.1.0 under a name that says otherwise, and npm makes that permanent
      # after 72 hours. Fail before anything is uploaded, not after.
      - name: Tag must match package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then
              echo "::error file=$f::$f is $v but the tag is $tag"
              status=1
            fi
          done
          [ $status -eq 0 ] && echo "all packages at $tag"
          exit $status
      # A tag never publishes something that would not have passed a PR
      - run: pnpm check
      - run: pnpm build
      # `pnpm -r publish`, not `npm publish`: the packages depend on each other
      # through `workspace:*`, and only pnpm rewrites that to the real version
      # range on the way out. npm would publish the literal `workspace:*` spec,
      # which no registry consumer can install.
      #
      # --no-git-checks: a tag build has detached HEAD, which pnpm otherwise
      # refuses to publish from.
      #
      # Packages whose version already exists in the registry are skipped, so
      # bumping one package and tagging does not republish the other eight.
      #
      # --provenance attests each tarball to this workflow run. It needs the
      # id-token: write permission above, a public repo, and a `repository`
      # field in the package manifest matching this one — all nine already
      # declare git+https://github.com/mydaogs/kit.git.
      - run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
