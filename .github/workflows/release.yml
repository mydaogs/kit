name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # The tag only triggers the release; package.json is the version of
      # record. Without this gate a v0.2.0 tag over 0.1.0 manifests publishes
      # 0.1.0 under a name that says otherwise, and npm makes that permanent
      # after 72 hours. Fail before anything is uploaded, not after.
      - name: Tag must match package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0
          for f in packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$tag" ]; then
              echo "::error file=$f::$f is $v but the tag is $tag"
              status=1
            fi
          done
          [ $status -eq 0 ] && echo "all packages at $tag"
          exit $status
      # A tag never publishes something that would not have passed a PR
      - run: pnpm check
      - run: pnpm build
      # The last gate before something permanent. Verifies every tarball
      # installs and imports as a consumer would, including the publishConfig
      # dist/ substitution that only materialises inside the tarball.
      - run: pnpm verify:dist
      # Prove the token authenticates BEFORE the first upload. `pnpm -r publish`
      # uploads one package at a time, so an auth failure partway through leaves
      # a partial release — and a published version is permanent after 72 hours.
      # A 403 here costs nothing; the same 403 on package six does not.
      - name: Check npm auth
        run: |
          who=$(npm whoami 2>&1) || {
            echo "::error::NPM_TOKEN did not authenticate: $who"
            echo "A token needs 2FA bypass to publish from CI — use a granular"
            echo "access token with bypass enabled, or a classic Automation token."
            exit 1
          }
          echo "authenticated as $who"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # `pnpm -r publish`, not `npm publish`: the packages depend on each other
      # through `workspace:*`, and only pnpm rewrites that to the real version
      # range on the way out. npm would publish the literal `workspace:*` spec,
      # which no registry consumer can install.
      #
      # --no-git-checks: a tag build has detached HEAD, which pnpm otherwise
      # refuses to publish from.
      #
      # Packages whose version already exists in the registry are skipped, so
      # bumping one package and tagging does not republish the other eight.
      #
      # Provenance attests each tarball to this workflow run. It needs the
      # id-token: write permission above, a public repo, and a `repository`
      # field in the manifest matching this one — all eleven declare
      # git+https://github.com/mydaogs/kit.git.
      #
      # Configured by env, not by `--provenance`: pnpm does not accept that
      # flag (it is absent from `pnpm publish --help`) and swallowed it in
      # silence during the 0.2.0 release, which published with no attestation
      # while reporting success. NPM_CONFIG_PROVENANCE reaches npm through its
      # own config layer instead.
      - run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      # Verify the attestation actually landed rather than trusting the setting.
      # This runs after an irreversible step on purpose: it cannot prevent a
      # provenance-less release, but it turns one into a loud failure that says
      # to cut the next patch with provenance, instead of a green run hiding it.
      - name: Verify provenance landed
        run: |
          missing=""
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            att=$(npm view "$name@$version" dist.attestations --json 2>/dev/null || echo "")
            if [ -z "$att" ] || [ "$att" = "null" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::published without provenance:$missing"
            exit 1
          fi
          echo "provenance attached to every package"
